<!DOCTYPE html>
<html>
<head>
    <title>FP Hands GLB Spike</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; }
        #info {
            position: fixed; top: 10px; left: 10px; color: #9ab;
            font: 13px monospace; pointer-events: none; z-index: 10;
            white-space: pre;
        }
    </style>
</head>
<body>
<div id="info">loading fp_hands_test.glb ...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131a);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);

scene.add(new THREE.HemisphereLight(0xbfd0e0, 0x33291f, 1.1));
const key = new THREE.DirectionalLight(0xfff4e0, 2.2);
key.position.set(-2, 4, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.7);
fill.position.set(3, 1, -2);
scene.add(fill);

const grid = new THREE.GridHelper(2, 20, 0x334, 0x223);
scene.add(grid);

let mixer = null, activeAction = null, gltfRoot = null;
window.__info = { status: 'loading' };

new GLTFLoader().load('/fp_hands_test.glb', (gltf) => {
    gltfRoot = gltf.scene;
    scene.add(gltfRoot);

    const names = gltf.animations.map(a => `${a.name} (${a.duration.toFixed(2)}s, ${a.tracks.length} tracks)`);
    console.log('animations:', names);
    window.__clips = gltf.animations;

    mixer = new THREE.AnimationMixer(gltfRoot);
    const clip = gltf.animations.find(a => a.name === 'sword_light') || gltf.animations[0];
    activeAction = mixer.clipAction(clip);
    activeAction.setLoop(THREE.LoopRepeat).play();
    mixer.update(0);
    gltfRoot.updateMatrixWorld(true);

    // measure real size: skinned meshes need computeBoundingBox (bones applied)
    const bbox = new THREE.Box3();       // everything (unit check)
    const handBox = new THREE.Box3();    // hands only (camera framing)
    const meshes = [];
    gltfRoot.traverse(o => {
        if (o.isSkinnedMesh) {
            // computeBoundingBox() applies bone transforms but leaves the
            // box in the mesh's local space — bring it to world space
            o.computeBoundingBox();
            const b = o.boundingBox.clone().applyMatrix4(o.matrixWorld);
            bbox.union(b); handBox.union(b);
            meshes.push(o.name + '[skinned]');
        }
        else if (o.isMesh) { bbox.union(new THREE.Box3().setFromObject(o)); meshes.push(o.name); }
    });
    const size = bbox.getSize(new THREE.Vector3());
    const center = bbox.getCenter(new THREE.Vector3());
    grid.position.y = bbox.min.y;

    // FP-ish camera: behind/above the hands (staging cam was -Y Blender = +Z glTF)
    const hSize = handBox.getSize(new THREE.Vector3());
    const hCenter = handBox.getCenter(new THREE.Vector3());
    const d = Math.max(hSize.x, hSize.y, hSize.z);
    camera.position.copy(hCenter).add(new THREE.Vector3(0, 0.5 * d, 1.3 * d));
    camera.lookAt(hCenter);
    window.__lookFrom = (dx, dy, dz, dist) => {
        const dir = new THREE.Vector3(dx, dy, dz).normalize();
        camera.position.copy(hCenter).addScaledVector(dir, dist * d);
        camera.lookAt(hCenter);
        renderer.render(scene, camera);
        return camera.position.toArray().map(v => +v.toFixed(3));
    };

    window.__info = {
        status: 'ok',
        animations: gltf.animations.map(a => ({ name: a.name, duration: +a.duration.toFixed(3), tracks: a.tracks.length })),
        playing: clip.name,
        meshes,
        bboxSize: size.toArray().map(v => +v.toFixed(3)),
        bboxCenter: center.toArray().map(v => +v.toFixed(3)),
    };
    document.getElementById('info').textContent =
        'clips: ' + names.join(' | ') + '\nplaying: ' + clip.name +
        '\nbbox (m): ' + size.toArray().map(v => v.toFixed(3)).join(' x ') +
        '\nmeshes: ' + meshes.join(', ');
}, undefined, (err) => {
    window.__info = { status: 'error', message: String(err) };
    document.getElementById('info').textContent = 'LOAD ERROR: ' + err;
});

// deterministic scrub for screenshots
window.__seek = (t) => {
    if (!mixer) return 'no mixer';
    mixer.setTime(t);
    gltfRoot.updateMatrixWorld(true);
    renderer.render(scene, camera);
    return 'seeked ' + t;
};
window.__playClip = (name) => {
    if (!mixer || !gltfRoot) return 'not loaded';
    const clip = window.__clips.find(a => a.name === name);
    if (!clip) return 'no clip ' + name;
    mixer.stopAllAction();
    activeAction = mixer.clipAction(clip);
    activeAction.setLoop(THREE.LoopRepeat).play();
    mixer.setTime(0);
    gltfRoot.updateMatrixWorld(true);
    renderer.render(scene, camera);
    return 'playing ' + name;
};
window.__shot = () => renderer.domElement.toDataURL('image/png');

const clock = new THREE.Clock();
function loop() {
    requestAnimationFrame(loop);
    if (mixer) mixer.update(clock.getDelta());
    renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
